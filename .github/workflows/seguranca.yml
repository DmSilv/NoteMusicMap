name: Segurança

# Procura falhas comuns de segurança no código JavaScript (API e painel). Roda a cada pull request,
# a cada envio ao main e uma vez por semana. O resultado aparece em GitHub › Security › Code scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
