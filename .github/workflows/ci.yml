name: CI

# Roda a cada envio e pull request: testa o núcleo, analisa o app e confirma
# que o build web compila. Assim, nada quebrado chega à Vercel.
on:
  push:
    branches: [main]
  pull_request:

# O Node.js 20 das actions está obsoleto no GitHub: força as actions JavaScript a rodarem no Node 24 (inclusive as de terceiros).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Testes do núcleo (afinação, detector, metrônomo, grade, pomodoro)
        working-directory: packages/afina_core
        run: |
          dart pub get
          dart test

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Testes da API (todos, sem rede)
        run: node --test api/*.test.js

      - name: Documentação em dia e dieta de texto
        run: |
          node scripts/check_docs.js
          node scripts/check_text.js
          node scripts/check_i18n.js

      - name: Análise estática
        run: flutter analyze

      - name: Build web (release)
        run: flutter build web --release

      - name: Teste de fumaça (fluxos principais + o app abre no Chrome)
        run: node scripts/smoke.js --web

      - name: Testes de tela do Flutter (modal de sucesso, tutorial guiado)
        run: node scripts/ui_tests.js
