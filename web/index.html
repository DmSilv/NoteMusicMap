<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Afinador, metrônomo com modo desafio, grade de afinação e controle de estudo para quem toca instrumento de corda. Grátis, sem cadastro e sem anúncios.">

  <!-- Prévia do link (WhatsApp, Instagram, Telegram, Facebook…) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Notemusic">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Notemusic: afinador, metrônomo e estudo para instrumentos de corda">
  <meta property="og:description" content="Grátis, sem cadastro e sem anúncios. Afinador em tempo real, metrônomo com modo desafio, grade de afinação e controle de estudo.">
  <meta property="og:image" content="https://notemusicmap.vercel.app/icons/Icon-512.png">
  <meta property="og:url" content="https://notemusicmap.vercel.app/">
  <meta name="twitter:card" content="summary">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#101418">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Notemusic">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Notemusic</title>
  <link rel="manifest" href="manifest.json">
  <!-- Instalar como app: o Chrome do Android avisa uma vez que dá para instalar; guardamos o aviso
       para o botão "Instalar" do app poder abrir a janela de instalação com um toque. -->
  <script>
    window.__nmInstall = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__nmInstall = e;
      window.dispatchEvent(new Event('nm-install-ready'));
    });
    window.addEventListener('appinstalled', function () {
      window.__nmInstall = null;
      window.dispatchEvent(new Event('nm-installed'));
    });
  </script>
  <!-- Funcionar sem internet: service worker próprio. Depois de carregar, pede para guardar tudo o que a página já baixou. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function () {
          return navigator.serviceWorker.ready;
        }).then(function (reg) {
          setTimeout(function () {
            var urls = performance.getEntriesByType('resource').map(function (e) { return e.name; });
            urls.push(location.origin + '/');
            var sw = reg.active || navigator.serviceWorker.controller;
            if (sw) sw.postMessage({ precache: urls });
          }, 8000);
        }).catch(function () { /* sem service worker o app funciona igual, só precisa de internet */ });
      });
    }
  </script>
  <!-- Motor de áudio (SoLoud) para a web -->
  <script src="assets/packages/flutter_soloud/web/init_soloud.js" defer></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
